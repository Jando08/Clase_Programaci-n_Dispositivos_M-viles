<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
</head>
<body>
  <h2>Iniciar sesión</h2>
  <form id="formLogin">
    <label>Correo <input type="email" id="correo" required></label><br><br>
    <label>Contraseña <input type="password" id="password" required></label><br><br>
    <button type="submit">Entrar</button>
  </form>
  <pre id="resultado"></pre>

<script>
// Misma clave que .env (ENCRYPTION_KEY = base64 de 32 bytes)
const ENCRYPTION_KEY = "M1HcE1WuKimXg+X1VKxL0NTUZgZmU47MUbtJxEsPAgM=";

function b64ToBuf(b64) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
}

function bufToB64(buf) {
    const u = new Uint8Array(buf);
    let bin = "";
    for (const c of u) bin += String.fromCharCode(c);
    return btoa(bin);
}

function concat(a, b) {
    const r = new Uint8Array(a.length + b.length);
    r.set(a, 0);
    r.set(b, a.length);
    return r;
}

async function encriptar(mensaje, claveB64) {
    const key = await crypto.subtle.importKey(
        "raw", b64ToBuf(claveB64),
        { name: "AES-GCM" }, false, ["encrypt"]
    );
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt(
        { name: "AES-GCM", iv }, key, new TextEncoder().encode(mensaje)
    ));
    // WebCrypto devuelve ciphertext + tag(16 al final)
    const tag = ct.slice(-16);
    const cipher = ct.slice(0, ct.length - 16);
    // token = base64( iv || tag || ciphertext )
    return bufToB64(concat(iv, concat(tag, cipher)));
}

document.getElementById("formLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;
    const resultado = document.getElementById("resultado");

    const token = await encriptar(password, ENCRYPTION_KEY);

    try {
        const res = await fetch("login.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuario: correo, password: token })
        });
        resultado.textContent = JSON.stringify(await res.json(), null, 2);
    } catch (err) {
        resultado.textContent = "Error: " + err.message;
    }
});
</script>
</body>
</html>
